<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="woodFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbd37b" />
      <stop offset="50%" stop-color="#df9e44" />
      <stop offset="100%" stop-color="#c27d28" />
    </linearGradient>
    <linearGradient id="woodBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#915217" />
      <stop offset="100%" stop-color="#5a2f09" />
    </linearGradient>
    <linearGradient id="woodHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbd37b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- 3D Bevel/Extrusion underneath -->
    <path d="M 5 5 L 18 31 L 22 23 L 31 22 Z" fill="url(#woodBevel)" stroke="#3e1d03" stroke-width="2" stroke-linejoin="round"/>
    <!-- Front Face -->
    <path d="M 3 2 L 15 28 L 19 20 L 28 19 Z" fill="url(#woodFront)" stroke="#783e0a" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Subtle Inner Highlight -->
    <path d="M 5 5 L 13 22 L 16 18 L 22 17 Z" fill="url(#woodHighlight)" opacity="0.6"/>
    <!-- Pointer Tip Accent -->
    <circle cx="4" cy="3" r="1.5" fill="#fff9e6"/>
  </g>
</svg>
